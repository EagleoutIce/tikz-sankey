name: CI

"on":
  push:
  pull_request:
  workflow_dispatch:

# a newer push to the same branch makes the running checks of the older one pointless
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # l3build builds in $TMPDIR (see build.lua); inside the workspace, the results stay readable
  # after the container of the LaTeX action is gone
  TMPDIR: /github/workspace/.l3build

jobs:
  tests:
    name: Regression tests (pdfTeX, LuaTeX) and example
    runs-on: ubuntu-latest
    steps:
      - name: Checkout git repository
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: 🧪 l3build check, then compile the example
        uses: xu-cheng/latex-action@v3
        with:
          extra_system_packages: "diffutils" # l3build needs GNU diff, not busybox
          pre_compile: mkdir -p "$TMPDIR" && l3build check
          root_file: example.tex
      - name: Keep the diffs of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-diffs
          path: |
            .l3build/tikz-sankey/test/*.diff
            .l3build/tikz-sankey/test/*.log
          if-no-files-found: ignore

  docs:
    name: Manual
    runs-on: ubuntu-latest
    steps:
      - name: Checkout git repository
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: 📄 Compile the manual and the example
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            example.tex
            tikz-sankey-doc.tex
      - name: No undefined references, no unresolved index or rerun requests
        run: |
          if grep -E "There were undefined references|Rerun to get|Label\(s\) may have changed|Hyper reference .* undefined" build/tikz-sankey-doc.log build/example.log; then
            exit 1
          fi
      - name: Keep the PDFs
        uses: actions/upload-artifact@v4
        with:
          name: pdfs
          path: |
            build/example.pdf
            build/tikz-sankey-doc.pdf

  package:
    name: CTAN archive
    runs-on: ubuntu-latest
    needs: [tests, docs]
    steps:
      - name: Checkout git repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0 # build.lua reads the version from the tags
      - name: 📦 l3build ctan
        uses: xu-cheng/latex-action@v3
        with:
          extra_system_packages: "diffutils git"
          pre_compile: mkdir -p "$TMPDIR" && git config --global --add safe.directory /github/workspace && l3build ctan
          root_file: example.tex
      - name: Keep the archive
        uses: actions/upload-artifact@v4
        with:
          name: ctan
          path: tikz-sankey-ctan.zip

  publish:
    name: Publish PDFs and preview to gh-pages
    runs-on: ubuntu-latest
    needs: [tests, docs]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write
    steps:
      - name: Checkout git repository
        uses: actions/checkout@v4
      - name: Fetch the PDFs
        uses: actions/download-artifact@v4
        with:
          name: pdfs
          path: build
      - name: Install poppler for the preview
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: 🖼️ Generate preview
        run: pdftoppm -png -r 400 -f 1 -l 1 ./build/example.pdf example
      - name: Commit
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -f "./build/example.pdf" "example-1.png" "./build/tikz-sankey-doc.pdf"
          git commit -m "Newly compiled data" || echo "nothing new to commit"
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          branch: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
          force: true
