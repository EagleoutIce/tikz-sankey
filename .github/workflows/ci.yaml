name: CI

"on":
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: texlive/texlive:latest
    steps:
      - uses: actions/checkout@v4
      - name: l3build check
        run: l3build check
      - name: Keep the diffs of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-diffs
          path: |
            /tmp/tikz-sankey/test/*.diff
            /tmp/tikz-sankey/test/*.log
          if-no-files-found: ignore

  docs:
    name: Manual, example and README pictures
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: texlive/texlive:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: latexmk
        run: latexmk
      - name: No undefined references or rerun requests
        run: |
          if grep -E "There were undefined references|Rerun to get|Label\(s\) may have changed|Hyper reference .* undefined" build/*.log; then
            exit 1
          fi
      - name: Render the pictures
        run: |
          gs -q -dSAFER -dBATCH -dNOPAUSE -sDEVICE=png16m -dTextAlphaBits=4 -dGraphicsAlphaBits=4 -r400 -dFirstPage=1 -dLastPage=1 -o build/example-1.png build/example.pdf
          gs -q -dSAFER -dBATCH -dNOPAUSE -sDEVICE=png16m -dTextAlphaBits=4 -dGraphicsAlphaBits=4 -r200 -o build/readme-example-%d.png build/readme-examples.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: pdfs
          path: |
            build/*.pdf
            build/*.png

  publish:
    name: Publish to gh-pages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [tests, docs]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pdfs
          path: build
      - name: Push
        run: |
          mv build/*.png .
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add -f build/example.pdf build/tikz-sankey-doc.pdf example-1.png readme-example-*.png
          git commit -m "Newly compiled data"
          git push -f origin HEAD:gh-pages
